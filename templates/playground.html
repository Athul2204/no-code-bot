{% extends "base.html" %}

  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Chat Playground</h1>
    <p class="mt-1 text-sm text-slate-500">Talk to your chatbot and watch it use actions.</p>

</div>

{% block scripts %}<script src="{{ url_for('static', filename='js/action_test.js') }}"></script><script src="{{ url_for('static', filename='js/playground.js') }}"></script>{% endblock %}
