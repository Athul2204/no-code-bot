{% extends "base.html" %}
{% block content %}
<div class="mb-6 flex flex-wrap items-start justify-between gap-3">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">{{ 'Edit chatbot' if bot_id else 'Create a chatbot' }}</h1>
    <p class="mt-1 text-sm text-slate-500">Describe what your chatbot does in plain English, then choose which actions it may use.</p>
  </div>
  <div id="page-actions" class="flex gap-2"></div>
</div>
<div id="app" data-bot-id="{{ bot_id }}"><div class="flex items-center justify-center gap-2 py-16 text-sm text-slate-500"><span class="spinner"></span> Loading…</div></div>
<noscript><p class="text-sm text-red-600">This page needs JavaScript.</p></noscript>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/chatbot_form.js') }}"></script>{% endblock %}
